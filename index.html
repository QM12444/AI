<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אפליקציית Round Heart PyScript</title>
    <!-- טעינת ספריות CSS ו-JS של PyScript -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>
    <style>
        body { padding: 20px; font-family: sans-serif; }
        #output-area { margin-top: 15px; padding: 10px; border: 1px solid #ccc; background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>אפליקציית PyScript שלי</h1>
    <p>טוען את הלוגיקה של האפליקציה מקובץ <strong>main.py</strong>...</p>

    <!-- תגית סקריפט זו אומרת ל-PyScript לטעון ולהריץ את קובץ ה-Python הקיים שלך -->
    <script type="py" src="main.py"></script>

    <h2>פלט:</h2>
    <!-- כאן יופיעו הודעות ה-print() שלך -->
    <div id="output-area"></div>

</body>
</html>
