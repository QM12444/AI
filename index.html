<!DOCTYPE html>
<html>
<head>
    <title>AI Chat App</title>
    <link rel="stylesheet" href="https://pyscript.net" />
    <script defer src="https://pyscript.net"></script>
</head>
<body>
    <h1>AI Assistant</h1>
    
    <!-- ייבוא קובץ הלוגיקה של הפייתון -->
    <py-script src="main.py"></py-script>

    <!-- תיבת טקסט לקלט המשתמש -->
    <input type="text" id="user_input" placeholder="שאל את ה-AI משהו..." style="width: 300px; padding: 10px;">
    
    <!-- כפתור שקורא לפונקציית הפייתון "send_message" בלחיצה -->
    <button id="send_button" py-click="send_message()">שלח</button>
    
    <!-- אזור הפלט שבו נוצגו ההודעות -->
    <h2>שיחה:</h2>
    <div id="chat_output" style="border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll;">
        <!-- הודעות ה-AI יופיעו כאן -->
    </div>
</body>
</html>
